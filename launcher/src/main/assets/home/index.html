<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>S95D 极简首页</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>
<main id="stage" aria-label="极简首页">
  <div id="wallpaper"></div><div class="shade"></div>
  <header class="clock"><div id="time">00:00</div><div id="date"></div></header>
  <aside class="calendar" aria-label="月历"><div id="month"></div><div id="calendar"></div></aside>
  <button id="settings" class="gear" aria-label="首页设置" data-action="settings"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m13 3-1 4-3 2-4-1-3 5 3 3v3l-3 3 3 5 4-1 3 2 1 4h6l1-4 3-2 4 1 3-5-3-3v-3l3-3-3-5-4 1-3-2-1-4z" transform="translate(0 -1) scale(.94)"/><circle cx="15.5" cy="15.5" r="5"/></svg></button>
  <section id="apps-section" class="shelf" aria-labelledby="apps-title">
    <h2 id="apps-title">我的应用</h2>
    <div class="row" id="apps-row">
      <button class="app focusable" data-action="app:bili" aria-label="打开 Bilibili"><span class="tile bili custom-artwork"><span class="bili-art"><img class="bili-brand" src="bilibili.png" alt=""></span><img class="installed-icon" alt=""></span><span class="label">Bilibili</span></button>
      <button class="app focusable" data-action="app:music" aria-label="打开网易云音乐"><span class="tile music"><span class="fallback music-mark"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="34"/><path d="M59 20v35c0 11-9 18-18 15-8-2-10-12-4-17 6-6 15-3 15 3M59 21l16-5"/></svg></span><img class="installed-icon" alt=""></span><span class="label">网易云音乐</span></button>
    </div>
  </section>
  <section id="inputs-section" class="shelf" aria-labelledby="sources-title">
    <h2 id="sources-title">外接设备</h2>
    <div class="row" id="inputs-row">
      <button class="input focusable" data-action="hdmi:1" aria-label="切换至 HDMI 1"><span class="tile other"><svg class="source-mark" viewBox="0 0 80 80" aria-hidden="true"><rect x="8" y="10" width="64" height="43" rx="4"/><path d="M40 54v14m-18 0h36"/></svg><span class="meta"><span class="name">HDMI 1</span><span class="port"><i class="dot unknown"></i>HDMI 1<span class="status">未连接</span></span></span></span></button>
      <button class="input focusable" data-action="hdmi:2" aria-label="切换至 HDMI 2"><span class="tile other"><svg class="source-mark" viewBox="0 0 80 80" aria-hidden="true"><rect x="8" y="10" width="64" height="43" rx="4"/><path d="M40 54v14m-18 0h36"/></svg><span class="meta"><span class="name">HDMI 2</span><span class="port"><i class="dot unknown"></i>HDMI 2<span class="status">未连接</span></span></span></span></button>
      <button class="input focusable" data-action="hdmi:3" aria-label="切换至 HDMI 3"><span class="tile other"><svg class="source-mark" viewBox="0 0 80 80" aria-hidden="true"><rect x="8" y="10" width="64" height="43" rx="4"/><path d="M40 54v14m-18 0h36"/></svg><span class="meta"><span class="name">HDMI 3</span><span class="port"><i class="dot unknown"></i>HDMI 3<span class="status">未连接</span></span></span></span></button>
      <button class="input focusable" data-action="hdmi:4" aria-label="切换至 HDMI 4"><span class="tile other"><svg class="source-mark" viewBox="0 0 80 80" aria-hidden="true"><rect x="8" y="10" width="64" height="43" rx="4"/><path d="M40 54v14m-18 0h36"/></svg><span class="meta"><span class="name">HDMI 4</span><span class="port"><i class="dot unknown"></i>HDMI 4<span class="status">未连接</span></span></span></span></button>
    </div>
  </section>
  <footer><span><kbd>OK</kbd> 打开</span><span><kbd>☰</kbd> 首页设置</span><span id="home-state">Home 返回已开启</span></footer>
  <div id="toast" role="status" aria-live="polite"></div>
</main>
<script src="home.js"></script>
</body>
</html>
